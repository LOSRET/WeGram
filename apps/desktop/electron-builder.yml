appId: dev.wegram.desktop
productName: WeGram
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  # tdjson.dll cannot be LoadLibrary'd from inside app.asar (RESULTS.md, conclusion 1)
  - '**/node_modules/@prebuilt-tdlib/**'
  - '**/node_modules/prebuilt-tdlib/**'
  # Windows Hello's native addon cannot be loaded from inside app.asar.
  - '**/node_modules/win-hello/**'
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
