name: Release

# Packaging is triggered by a version bump: a push to main whose root
# package.json version has no `v<version>` tag yet gets exactly one release.
# Pushing a `v*` tag (or running the workflow manually) still works and
# republishes/refreshes the assets of that tag.
#
# One release per version: once the tag exists, later pushes to main with the
# same version skip the packaging job.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package (optional; defaults to the package.json version)'
        required: false
        type: string

permissions:
  contents: write # tag creation + gh release create/upload

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the version
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      due: ${{ steps.version.outputs.due }}
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v7

      - name: Resolve version and whether a release is due
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $explicit = '${{ inputs.tag }}'
          $refType = '${{ github.ref_type }}'
          $refName = '${{ github.ref_name }}'
          $version = $null
          $tag = $null
          $due = 'true'

          if ($explicit) {
            $tag = $explicit
          } elseif ($refType -eq 'tag') {
            $tag = $refName
          } else {
            # A push to main: the root manifest is the version source of truth.
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $version = [string]$pkg.version
            $tag = "v$version"
            $existing = git ls-remote --tags origin "refs/tags/$tag"
            if ($existing) { $due = 'false' }
            Write-Host "main version $version -> tag $tag, release due = $due"
          }

          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Expected a vX.Y.Z tag or a semver package.json version, got '$tag'."
          }
          if (-not $version) { $version = $Matches.version }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "due=$due" >> $env:GITHUB_OUTPUT

  package:
    name: Package Windows x64
    needs: prepare
    if: needs.prepare.outputs.due == 'true'
    # The NSIS build needs nsis + winCodeSign downloads and an Electron dist; 45 min is ample.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6 # no version input: packageManager in package.json wins

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp the version into the workspace
        run: |
          $ErrorActionPreference = 'Stop'
          # electron-builder reads apps/desktop/package.json and Electron reports it
          # through app.getVersion(), so the resolved version is written into the root
          # manifest and synced by the same script developers use.
          node -e 'const fs = require("fs"); const p = "package.json"; const pkg = JSON.parse(fs.readFileSync(p, "utf8")); pkg.version = process.argv[1]; fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");' $env:VERSION
          pnpm sync-version
          pnpm check:version
          Write-Host "Packaging WeGram $env:VERSION from $env:TAG"

      - name: Verify (version check -> lint -> typecheck -> test -> build)
        run: pnpm verify

      # The installer carries this deployment's own api_id/api_hash (inlined into the
      # main bundle by electron.vite.config.ts). Without them the packaged app refuses
      # to start, so fail here instead of after a four-minute build.
      - name: Check the API credentials are configured
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if (-not $env:TELEGRAM_API_ID -or -not $env:TELEGRAM_API_HASH) {
            throw 'Repository secrets TELEGRAM_API_ID and TELEGRAM_API_HASH are required.'
          }
          Write-Host "Packaging with api_id $env:TELEGRAM_API_ID"

      - name: Package the installer
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: pnpm --filter @wegram/desktop package:win

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: wegram-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          # An empty pattern must fail the job instead of quietly publishing nothing.
          if-no-files-found: error

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(needs.prepare.outputs.version, '-') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem apps/desktop/release -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap' } |
            ForEach-Object FullName)
          if ($assets.Count -eq 0) { throw 'electron-builder produced no installer.' }

          # A main-push release has no tag yet: create it at the built commit. Pushing a
          # tag from the workflow does not retrigger it (GITHUB_TOKEN events are dropped).
          $existing = git ls-remote --tags origin "refs/tags/$env:TAG"
          if (-not $existing) {
            git tag $env:TAG $env:GITHUB_SHA
            git push origin $env:TAG
            Write-Host "created tag $env:TAG"
          }

          # Re-running a tag must refresh the assets instead of failing on an existing release.
          gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
          }
          else {
            $ghArgs = @('release', 'create', $env:TAG) + $assets + @(
              '--title', "WeGram $env:VERSION",
              '--generate-notes',
              '--verify-tag'
            )
            if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
            gh @ghArgs
          }
