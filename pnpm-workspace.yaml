packages:
  - apps/*
  - packages/*

# Packages allowed to run lifecycle/build scripts (pnpm 12: a name -> boolean map).
# electron: downloads the binary; esbuild: installs its native binary;
# tdl: node-gyp-build (no-op when a prebuild is present).
# electron-winstaller (pulled in by electron-builder) is denied on purpose: it only
# serves the squirrel.windows target, which this project does not package.
allowBuilds:
  electron: true
  esbuild: true
  tdl: true
  electron-winstaller: false

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.108.1'
  - '@tanstack/react-query@5.108.1'
